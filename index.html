<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{--ink:#15181E;--sub:#5B6472;--line:#E3E6EB;--bg:#F4F5F7;--acc:#1F4FD8;--acct:#EAF0FF;--warn:#B4410E;--warnt:#FFF1E8;--bd:#C9CED6}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans KR',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,p{margin:0}
a{color:var(--acc)}
.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line);padding:8px 16px}
.top .brand{font-weight:700}
.top .brand span{font-weight:500;color:var(--warn);font-size:13px;margin-left:6px}
.seg{display:flex;gap:4px;background:var(--bg);border-radius:10px;padding:4px}
.seg a{display:flex;align-items:center;min-height:36px;padding:0 14px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:14px;font-weight:500}
.seg a.on{background:var(--acc);color:#fff;font-weight:700}
.shell{display:flex;flex-wrap:wrap;align-items:stretch;min-height:calc(100vh - 53px)}
.nav{flex:1 1 220px;background:var(--ink);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:6px}
.nav a{display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:8px;color:#D5D9E0;text-decoration:none}
.nav a.on{background:var(--acc);color:#fff;font-weight:700}
.nav .navsec{margin-top:14px;padding:12px 12px 4px;border-top:1px solid #2E3440;font-size:13px;font-weight:700;color:#A9B1BD;overflow-wrap:anywhere}
.pjs{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.nav .note{margin-top:16px;padding:12px;border-radius:8px;background:#262B34;color:#D5D9E0;font-size:13px;line-height:1.6}
main{flex:999 1 560px;min-width:0;padding:28px;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px}
.head h1{font-size:24px}
.sub{color:var(--sub);font-size:14px}
.small{font-size:13px;color:var(--sub)}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h2{font-size:18px}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.g3{flex:3 1 480px;min-width:0}.g2{flex:2 1 340px;min-width:0}.g1{flex:1 1 290px;min-width:0}
.col{display:flex;flex-direction:column;gap:16px}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--bd);background:#fff;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink);font-size:14px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.btn.warn{background:var(--warnt);border-color:var(--warn);color:var(--warn);font-weight:700}
.btn.line{border-color:var(--acc);color:var(--acc);font-weight:700}
.btn.sm{min-height:38px;padding:0 12px}
.btn.big{min-height:56px;font-size:17px;border-radius:12px;width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label,.lbl{font-size:14px;font-weight:500}
.in{min-height:46px;border:1px solid var(--bd);border-radius:10px;padding:0 14px;background:#fff;width:100%}
textarea.in{padding:12px 14px;resize:vertical;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
thead th{background:var(--bg);color:var(--sub);font-weight:500;border-bottom:0;white-space:nowrap}
td.num,th.num{text-align:center}
tr.sum td,tr.sum th{background:var(--acct);font-weight:700}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--acct);color:var(--acc)}.b-wait{background:var(--warnt);color:var(--warn)}.b-none{background:var(--bg);color:var(--sub)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
.kpi{gap:6px}.kpi .n{font-size:30px;font-weight:700}.kpi .n small{font-size:15px;font-weight:500}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}.bar i{display:block;height:8px;background:var(--acc)}
.thumb{width:56px;height:56px;border-radius:8px;background:#E9ECF1;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--sub);flex-shrink:0}
.imgs{display:flex;flex-wrap:wrap;gap:8px}
.imgs .it{position:relative}
.imgs img{width:72px;height:72px;border-radius:8px;object-fit:cover;display:block;background:#E9ECF1}
.imgs .x{position:absolute;right:-6px;top:-6px;width:26px;height:26px;border-radius:999px;border:0;background:var(--ink);color:#fff;cursor:pointer;font-size:14px;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;min-width:56px;padding:0 10px;border-radius:8px;border:1px solid var(--bd);background:#fff;cursor:pointer}
.chip.out{border-color:var(--warn);background:var(--warnt);color:var(--warn);text-decoration:line-through}
.chk{display:flex;align-items:center;gap:10px;min-height:44px}
.chk input{width:20px;height:20px;margin:0;accent-color:var(--acc);flex-shrink:0}
.empty{padding:28px 12px;text-align:center;color:var(--sub)}
.logi{padding:10px 0;border-bottom:1px solid var(--line)}
.phonewrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px 12px}
.phone{width:100%;max-width:390px;min-height:780px;background:#fff;border:8px solid var(--ink);border-radius:32px;overflow:hidden;overflow:clip;display:flex;flex-direction:column}
.pv{width:100%;max-width:300px;min-height:560px;border:6px solid var(--ink);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;background:var(--acc);font-size:13px}
.m-hero{background:var(--acc);color:#fff;padding:48px 24px 28px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.m-hero .ic{width:72px;height:72px;border-radius:999px;background:#fff;color:var(--acc);display:flex;align-items:center;justify-content:center}
.m-hero h1{font-size:26px;line-height:1.35}
.m-sheet{flex-grow:1;background:#fff;border-radius:24px 24px 0 0;padding:28px 24px 0;display:flex;flex-direction:column;gap:18px}
.m-greet{flex-grow:1;display:flex;flex-direction:column;background:var(--acc)}
.m-body{white-space:pre-line;font-size:16px;line-height:1.8;overflow-wrap:anywhere}
.gimg{display:block;width:100%;max-height:280px;object-fit:contain;border-radius:12px}
.m-dday{background:var(--bg);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;font-size:14px}
.pill{background:var(--acc);color:#fff;font-weight:700;padding:3px 10px;border-radius:999px;flex-shrink:0;font-size:14px}
.m-foot{background:#fff;padding:16px 24px 28px;display:flex;flex-direction:column;gap:12px}
.m-foot .small{text-align:center}
.m-page{flex-grow:1;display:flex;flex-direction:column;background:#fff}
.m-pad{padding:8px 24px 0;display:flex;flex-direction:column;gap:18px;flex-grow:1}
.m-pad h1{font-size:24px;line-height:1.35}
.back{width:44px;height:44px;border:0;background:transparent;border-radius:999px;display:flex;align-items:center;justify-content:center;cursor:pointer;margin:8px 8px 0}
.m-listhead{background:#fff;padding:18px 20px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.m-listhead h1{font-size:21px;line-height:1.35}
.m-list{flex-grow:1;background:var(--bg);padding:16px 20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-content:start}
.pcard{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;padding:0;text-align:left;cursor:pointer}
.pcard .ph,.pcard img{height:140px;width:100%;background:#E9ECF1;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--sub)}
.pcard .tx{padding:12px;display:flex;flex-direction:column;gap:4px}
.pcard b{font-size:15px}
.gal{height:240px;background:#E9ECF1;position:relative;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:13px;flex-shrink:0}
.gal img{width:100%;height:240px;object-fit:cover;display:block}
.gal .back{position:absolute;left:4px;top:4px;background:#fff;margin:8px}
.gal .nv{position:absolute;top:98px;width:44px;height:44px;border-radius:999px;border:0;background:#fff;cursor:pointer;font-size:18px}
.gal .cnt{position:absolute;right:12px;bottom:12px;background:rgba(21,24,30,.75);color:#fff;border-radius:999px;padding:2px 10px;font-size:12px}
.dimg{display:block;width:100%;height:auto;min-height:120px;background:#E9ECF1}
.m-bar{position:sticky;bottom:0;z-index:5;background:#fff;border-top:1px solid var(--line);padding:12px 20px 20px;display:flex;flex-direction:column;gap:8px}
.sheet-bg{position:fixed;inset:0;z-index:15;background:rgba(21,24,30,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:390px;max-height:85vh;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:10px 20px 24px;display:flex;flex-direction:column;gap:14px}
.sheet.up{animation:sheetup .25s ease-out}
@keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}
@media(prefers-reduced-motion:reduce){.sheet.up{animation:none}}
.grab{width:44px;height:5px;border-radius:999px;background:var(--bd);margin:0 auto}
.tip{background:var(--acct);border-radius:12px;padding:12px 14px;font-size:13px;white-space:pre-line}
.sizes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.sz{height:46px;border-radius:10px;border:1px solid var(--bd);background:#fff;font-weight:500;cursor:pointer}
.sz.on{border:2px solid var(--acc);background:var(--acc);color:#fff}
.sz:disabled{background:var(--bg);color:#6B7380;text-decoration:line-through;cursor:not-allowed}
.sumbox{border:1px solid var(--line);border-radius:14px;padding:2px 18px}
.sumbox div{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--line)}
.sumbox div:last-child{border-bottom:0}
.sumbox span:first-child{color:var(--sub);flex-shrink:0}.sumbox span:last-child{font-weight:500;text-align:right;overflow-wrap:anywhere}
.err{color:var(--warn);font-size:14px;font-weight:500}
.okic{width:72px;height:72px;border-radius:999px;background:var(--acct);color:var(--acc);display:flex;align-items:center;justify-content:center;margin:0 auto}
.modal{position:fixed;inset:0;background:rgba(21,24,30,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal .card{width:100%;max-width:520px;max-height:90vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;z-index:30;max-width:90vw;display:none}
.banner{background:var(--warnt);color:var(--warn);border:1px solid var(--warn);border-radius:10px;padding:10px 14px;font-size:14px}
@media(max-width:560px){main{padding:18px 14px}.phonewrap{padding:0}.phonewrap>.small{display:none}.phone{max-width:none;border:0;border-radius:0;min-height:calc(100vh - 53px)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
function mReset(){ return {step:'greet', personId:null, productId:null, size:null, img:0, err:'', name:'', last4:'', agree:false, addr:'', zip:'', road:'', addr2:'', addrOpen:false, manual:false, sheet:false, sheetAnim:false}; }
var BASE_URL = location.origin + location.pathname;
var CFG = window.SHOE_CONFIG || {};
function newToken(){ var a=new Uint8Array(20), s='', ch='abcdefghijklmnopqrstuvwxyz0123456789', i; try{ crypto.getRandomValues(a); }catch(e){ for(i=0;i<20;i++) a[i]=Math.floor(Math.random()*256); } for(i=0;i<20;i++) s+=ch[a[i]%36]; return s; }
function personLink(p){ return BASE_URL+'#t-'+p.token; }
var VIEWS = ['home','products','total','dashboard','people','greeting','mobile'];
var PROJECT_VIEWS = ['dashboard','people','greeting'];
var STATUS = [['prep','준비중'],['open','진행중'],['closed','마감'],['ordered','발주 완료'],['shipped','배송 완료']];
var DEFAULT_CONFIG = { name:'', client:'', status:'prep', top:'', title:'{이름}님께 신발을 선물합니다', body:'', sender:'', start:'', end:'', ship:'company', productIds:null, imageId:null };
var S = {
  view:'home', auth:'loading', login:{email:'',pw:'',err:''}, pid:null, link:null, linkOk:false, linkDone:false, ready:false, slow:false, local:false, failed:false,
  products:[], people:[], logs:[], projects:[],
  pd:null, pe:{name:'',team:'',phone:''}, cfg:null,
  confirm:null, filter:{q:'',st:'all'}, modal:null, busy:'',
  m:mReset()
};
var sb=null, assets=null, downloads=null, wseq=0, pend=0, composing=false, pending=false;

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function strip(o){ var r={}; for(var k in o){ if(k!=='id') r[k]=o[k]; } return r; }
function digits(s){ return String(s||'').replace(/\D/g,''); }
function maskPhone(s){ var d=digits(s); if(d.length<8) return s||'-'; return d.slice(0,3)+'-****-'+d.slice(-4); }
function range(a,b){ var r=[]; for(var v=a; v<=b; v+=5) r.push(v); return r; }
var DOW='일월화수목금토';
function parseD(s){ var p=String(s||'').split('-').map(Number); if(p.length!==3||!p[0]) return null; return new Date(p[0],p[1]-1,p[2]); }
function fmtDate(s){ var d=parseD(s); return d ? (d.getMonth()+1)+'월 '+d.getDate()+'일('+DOW[d.getDay()]+')' : ''; }
function fmtTime(ms){ if(!ms) return ''; var d=new Date(ms); function z(n){return n<10?'0'+n:n;} return (d.getMonth()+1)+'/'+d.getDate()+' '+z(d.getHours())+':'+z(d.getMinutes()); }
function dday(end){ var d=parseD(end); if(!d) return null; var t=new Date(); var a=new Date(t.getFullYear(),t.getMonth(),t.getDate()); return Math.round((d-a)/864e5); }
function ddayLabel(n){ return n==null ? '-' : n>0 ? 'D-'+n : n===0 ? '오늘 마감' : '마감됨'; }
function project(id){ return S.projects.filter(function(p){return p.id===id;})[0]; }
function curProject(){ return S.pid ? project(S.pid) : null; }
function curPeople(){ return S.people.filter(function(p){return p.projectId===S.pid;}); }
function cfg(){ return curProject() || DEFAULT_CONFIG; }
function closed(){ var c=cfg(), n=dday(c.end); return (n!=null && n<0) || ['closed','ordered','shipped'].indexOf(c.status)>=0; }
function statusLabel(s){ var r=STATUS.filter(function(x){return x[0]===s;})[0]; return r ? r[1] : '준비중'; }
function stClass(s){ return s==='open' ? 'b-ok' : s==='closed' ? 'b-wait' : 'b-none'; }
function setPid(id){ S.pid=id||null; S.cfg=null; S.confirm=null; S.modal=null; S.filter={q:'',st:'all'}; S.m=mReset(); try{ if(id) localStorage.setItem('shoe-pid',id); else localStorage.removeItem('shoe-pid'); }catch(e){} }
function pjStats(p){ var pp=S.people.filter(function(x){return x.projectId===p.id;}); var done=pp.filter(function(x){return x.choice;}).length; return {total:pp.length,done:done,pct:pp.length?Math.round(done/pp.length*100):0}; }
function byCreated(a,b){ return (a.createdAt||0)-(b.createdAt||0); }
function projProducts(){ var ids=cfg().productIds; return S.products.filter(function(p){ return !ids || ids.indexOf(p.id)>=0; }); }
function product(id){ return S.products.filter(function(p){return p.id===id;})[0]; }
function person(id){ return S.people.filter(function(p){return p.id===id;})[0]; }
function img(id){ return String(CFG.supabaseUrl||'').replace(/\/$/,'')+'/storage/v1/object/public/shoes/'+encodeURIComponent(id); }
function projName(c){ c=c||cfg(); return c.name || ((c.client||'[고객사명]')+' 임직원 선물'); }
function personTitle(name){ var t=cfg().title||DEFAULT_CONFIG.title; return name ? t.split('{이름}').join(name) : t.split('{이름}님').join('임직원 여러분').split('{이름}').join('임직원 여러분'); }

function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(function(){t.style.display='none';},3200); }
function failMsg(e){ toast(e && e.code==='42501' ? '저장 권한이 없어요. 관리자 계정으로 로그인했는지 확인해 주세요.' : '저장하지 못했어요. 인터넷 연결과 로그인 상태를 확인해 주세요.'); }

/* ---------- 저장 ---------- */
function uid(){ try{ return crypto.randomUUID(); }catch(e){ return newToken()+newToken(); } }
function localSet(col,id,data){ var arr=S[col], row={id:id}, i=-1, k; for(k in data) row[k]=data[k]; arr.forEach(function(x,n){ if(x.id===id) i=n; }); if(i>=0) arr[i]=row; else arr.push(row); }
function saveDoc(col,id,data){
  if(!sb || S.auth!=='in') return Promise.reject({code:'noauth'});
  id = id || uid();
  var row={id:id,data:data};
  if(col==='people'){ if(!data.token) data.token=newToken(); row.project_id=data.projectId; row.token=data.token; }
  if(col==='logs') row.project_id=data.projectId||null;
  wseq++; pend++;
  return sb.from(col).upsert(row).then(function(r){ pend--; wseq++; if(r.error) throw r.error; localSet(col,id,data); render(); return id; },function(e){ pend--; throw e; });
}
function delDoc(col,id){
  if(!sb || S.auth!=='in') return Promise.reject({code:'noauth'});
  wseq++; pend++;
  return sb.from(col).delete().eq('id',id).then(function(r){ pend--; wseq++; if(r.error) throw r.error; S[col]=S[col].filter(function(x){return x.id!==id;}); render(); },function(e){ pend--; throw e; });
}
function saveConfig(data){ return saveDoc('projects',S.pid,data); }
function addLog(title,result){ return saveDoc('logs',null,{projectId:S.pid,title:title,result:result,createdAt:Date.now()}).catch(function(){}); }

function uploadImage(file){
  var ext=String(file.name||'').split('.').pop().toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
  var path=Date.now()+'-'+newToken().slice(0,8)+'.'+ext;
  return sb.storage.from('shoes').upload(path,file,{cacheControl:'31536000',upsert:false}).then(function(r){ if(r.error) throw r.error; return {id:path}; });
}
function loadAll(){
  var w=wseq;
  return Promise.all(['products','projects','people','logs'].map(function(t){ return sb.from(t).select('id,data').limit(5000); })).then(function(rs){
    if(rs.some(function(r){return r.error;})) throw rs.filter(function(r){return r.error;})[0].error;
    if(w!==wseq || pend>0) return;
    function rows(r){ return (r.data||[]).map(function(d){ var o={id:d.id}, k; for(k in d.data) o[k]=d.data[k]; return o; }); }
    S.products=rows(rs[0]).sort(byCreated); S.projects=rows(rs[1]).sort(byCreated); S.people=rows(rs[2]).sort(byCreated);
    S.logs=rows(rs[3]).sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});
    S.failed=false; S.ready=true; S.slow=false; schedule();

function matrix(people,ps){
  people=people||curPeople(); ps=ps||projProducts(); var cnt={}, chosen={};

  var rows=S.products.filter(function(p){ return ps.indexOf(p)>=0 || chosen[p.id]; });
  var set={}; rows.forEach(function(p){ (p.sizes||[]).forEach(function(s){ set[s]=1; }); });
  people.forEach(function(p){ if(p.choice && product(p.choice.productId)) set[p.choice.size]=1; });

function filteredPeople(){
  var q=S.filter.q.trim(), st=S.filter.st;
  return curPeople().filter(function(p){
    if(st==='done' && !p.choice) return false;
    if(st==='wait' && p.choice) return false;
    return !q || (p.name||'').indexOf(q)>=0 || (p.team||'').indexOf(q)>=0;
  });
}

function saveFile(name,aoaSheets){

    else {

      var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download=name+'.csv'; document.body.appendChild(a); a.click(); a.remove();

function parseRoster(file){
  return file.arrayBuffer().then(function(buf){
    var rows;
    if(window.XLSX){ var wb=XLSX.read(buf,{type:'array'}); rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''}); }
    else { rows=new TextDecoder('utf-8').decode(buf).replace(/^﻿/,'').split(/\r?\n/).map(function(l){return l.split(',');}); }
    rows=rows.filter(function(r){ return r && r.some(function(v){return String(v).trim();}); });
    if(!rows.length) return [];
    var ni=0, ti=1, pi=2, head=rows[0].map(function(v){return String(v).trim();});
    var hasHead=head.some(function(v){return v.indexOf('이름')>=0||v.indexOf('성명')>=0;});
    if(hasHead){ head.forEach(function(v,i){ if(v.indexOf('이름')>=0||v.indexOf('성명')>=0) ni=i; else if(v.indexOf('부서')>=0||v.indexOf('팀')>=0) ti=i; else if(v.indexOf('연락처')>=0||v.indexOf('휴대')>=0||v.indexOf('전화')>=0) pi=i; }); rows=rows.slice(1); }
    return rows.map(function(r){ return {name:String(r[ni]||'').trim(),team:String(r[ti]||'').trim(),phone:String(r[pi]||'').trim()}; }).filter(function(p){return p.name;});
  });
}

      S.busy=''; if(r.error){ var em=String(r.error.message||''), ec=String(r.error.code||''); l.err = (ec==='email_not_confirmed'||/not confirmed/i.test(em)) ? '이메일 확인이 안 된 계정이에요. Supabase의 Authentication > Users에서 계정을 지우고 Auto Confirm User를 켠 채로 다시 만들어 주세요.' : /api key|apikey|jwt/i.test(em) ? 'config.js의 키가 맞지 않아요. Publishable key를 다시 복사해 넣어 주세요.' : (ec==='invalid_credentials'||/invalid login/i.test(em)) ? '이메일이나 비밀번호가 맞지 않아요. Supabase의 Authentication > Users에 만든 계정인지 확인해 주세요.' : '로그인하지 못했어요. ('+em+')'; render(); return; }
      l.pw=''; afterLogin();
    },function(){ S.busy=''; l.err='서버에 연결하지 못했어요.'; render(); });
  },
  'logout':function(){ sb.auth.signOut().then(function(){},function(){}); S.auth='out'; S.products=[]; S.projects=[]; S.people=[]; S.logs=[]; S.modal=null; render(); },
  'cancel-confirm':function(){ S.confirm=null; render(); },
  'pd-new':function(){ S.pd=newPd(null); render(); },
  'pd-edit':function(v){ S.pd=newPd(product(v)); render(); },
  'pd-cancel':function(){ S.pd=null; render(); },
  'pd-sold':function(v){ var s=Number(v), a=S.pd.soldOut, i=a.indexOf(s); if(i>=0) a.splice(i,1); else a.push(s); a.sort(function(x,y){return x-y;}); render(); },
  'pd-rmthumb':function(){ S.pd.thumbId=null; render(); },
  'pd-rmdetail':function(v){ S.pd.detailIds.splice(Number(v),1); render(); },
  'pd-save':function(){
    var d=S.pd, sizes=range(d.from,d.to);
    if(!d.name.trim()){ toast('상품명을 입력해 주세요.'); return; }
    if(!sizes.length){ toast('사이즈 범위를 확인해 주세요.'); return; }
    var data={name:d.name.trim(),desc:d.desc,tip:d.tip,sizes:sizes,soldOut:d.soldOut.filter(function(s){return sizes.indexOf(s)>=0;}),thumbId:d.thumbId,detailIds:d.detailIds,createdAt:d.createdAt||Date.now()};

  },
  'pd-del':function(v){ S.confirm=null; if(S.pd&&S.pd.id===v) S.pd=null; delDoc('products',v).then(function(){ toast('상품을 삭제했어요.'); }).catch(failMsg); render(); },
  'pe-add':function(){
    var e=S.pe; if(!e.name.trim()){ toast('이름을 입력해 주세요.'); return; }
    if(digits(e.phone).length<8){ toast('연락처를 입력해 주세요. 카카오톡 안내를 보낼 번호예요.'); return; }
    saveDoc('people',null,{projectId:S.pid,token:newToken(),name:e.name.trim(),team:e.team.trim(),phone:e.phone.trim(),createdAt:Date.now()}).then(function(){ S.pe={name:'',team:'',phone:''}; render(); toast('대상자를 추가했어요.'); }).catch(failMsg);
  },
  'pe-del':function(v){ S.confirm=null; delDoc('people',v).catch(failMsg); render(); },
  'pe-reset':function(v){ var p=person(v); if(!p) return; var d=strip(p); delete d.choice; delete d.address; saveDoc('people',v,d).then(function(){ toast('선택을 초기화했어요.'); }).catch(failMsg); },
  'as-person':function(v){ var p=person(v); if(!p) return; S.m=mReset(); S.m.personId=p.id; S.m.addr=p.address||''; location.hash='mobile'; S.view='mobile'; render(); window.scrollTo(0,0); },
  'msg':function(v){ S.modal=v; render(); },
  'md-close':function(){ S.modal=null; render(); },
  'md-copy':function(){ var t=document.getElementById('md-text'); try{ navigator.clipboard.writeText(t.value).then(function(){ toast('복사했어요.'); },function(){ t.focus(); t.select(); toast('복사가 막혀 있어요. 선택된 글을 직접 복사해 주세요.'); }); }catch(e){ t.focus(); t.select(); toast('선택된 글을 직접 복사해 주세요.'); } },
  'md-mark':function(){
    var k=S.modal, now=Date.now();
    var targets = k==='remind' ? curPeople().filter(function(p){return !p.choice;}) : curPeople().filter(function(p){return !p.sentAt;});
    S.busy='mark'; render();
    var job = k==='remind' ? Promise.resolve() : seqEach(targets,function(p){ var d=strip(p); d.sentAt=now; return saveDoc('people',p.id,d); });
    job.then(function(){ return addLog(k==='remind'?'리마인드':'첫 안내', targets.length+'명 대상 · 문구를 직접 보낸 것으로 기록'); }).then(function(){ S.busy=''; S.modal=null; render(); toast('기록했어요.'); }).catch(function(e){ S.busy=''; render(); failMsg(e); });
  },
  'cfg-rmimg':function(){ if(S.cfg){ S.cfg.imageId=null; render(); } },
  'cfg-reset':function(){ S.cfg=cloneCfg(); render(); },
  'cfg-save':function(){
    var c=S.cfg, cur=curProject(), data={}; if(!c||!cur) return; for(var k in DEFAULT_CONFIG) data[k]=c[k]; data.createdAt=cur.createdAt||Date.now();
    if(data.start && data.end && data.start>data.end){ toast('마감일이 시작일보다 빨라요.'); return; }
    saveConfig(data).then(function(){ toast('설정을 저장했어요.'); }).catch(failMsg);
  },
  'dl-order':function(){ saveFile('발주서',orderSheets()); },
  'dl-template':function(){ saveFile('대상자_명단_양식',[{name:'명단',rows:[['이름','부서','연락처'],['홍길동','영업팀','010-0000-1234']]}]); },
  'm-restart':function(){ S.m=mReset(); render(); },
  'pj-open':function(v){ setPid(v); S.view='dashboard'; location.hash='dashboard'; render(); window.scrollTo(0,0); },
  'pj-pick':function(v){ setPid(v); render(); },
  'pj-new':function(){
    var d={},k; for(k in DEFAULT_CONFIG) d[k]=DEFAULT_CONFIG[k]; d.name='새 프로젝트'; d.createdAt=Date.now();
    saveDoc('projects',null,d).then(function(id){
      if(!project(id)){ var row={id:id}; for(var k2 in d) row[k2]=d[k2]; S.projects.push(row); }
      setPid(id); S.view='greeting'; location.hash='greeting'; render(); toast('프로젝트를 만들었어요. 프로젝트명과 인삿말부터 채워 주세요.');
    }).catch(failMsg);
  },
  'pj-dup':function(v){ var p=project(v); if(!p) return; var d=strip(p); d.name=projName(p)+' (복사)'; d.status='prep'; d.start=''; d.end=''; d.createdAt=Date.now(); saveDoc('projects',null,d).then(function(){ toast('복제했어요. 대상자 명단과 선택 기간은 복사하지 않았어요.'); }).catch(failMsg); },
  'pj-del':function(v){
    S.confirm=null; if(S.pid===v) setPid(null);
    var pp=S.people.filter(function(p){return p.projectId===v;}), lg=S.logs.filter(function(l){return l.projectId===v;});
    seqEach(pp,function(p){ return delDoc('people',p.id); }).then(function(){ return seqEach(lg,function(l){ return delDoc('logs',l.id); }); }).then(function(){ return delDoc('projects',v); }).then(function(){ toast('프로젝트를 삭제했어요.'); }).catch(failMsg);
    render();
  },
  'dl-total':function(){ saveFile('전체_발주_합산',totalSheets()); },
  'm-go':function(v){ mGo(v); },
  'm-start':function(){ var me=person(S.m.personId); if(!me) return; mGo(me.choice?'done':'list'); },
  'm-person':function(v){ var p=person(v); if(!p) return; S.m=mReset(); S.m.personId=p.id; S.m.addr=p.address||''; render(); },
  'pe-link':function(v){
    var p=person(v); if(!p) return;
    if(p.token){ S.modal='link:'+v; render(); return; }
    var d=strip(p); d.token=newToken(); saveDoc('people',v,d).then(function(){ S.modal='link:'+v; render(); }).catch(failMsg);
  },
  'pe-reissue':function(v){ S.confirm=null; var p=person(v); if(!p) return; var d=strip(p); d.token=newToken(); saveDoc('people',v,d).then(function(){ toast('새 링크를 만들었어요. 이전 링크는 더는 열리지 않아요.'); }).catch(failMsg); render(); },
  'dl-links':function(){
    var miss=curPeople().filter(function(p){return !p.token;});
    seqEach(miss,function(p){ var d=strip(p); d.token=newToken(); p.token=d.token; return saveDoc('people',p.id,d); }).then(function(){
      var rows=[['이름','부서','연락처','개인 링크','상태']];
      curPeople().forEach(function(p){ rows.push([p.name,p.team||'',p.phone||'',p.token?personLink(p):'',statusText(p)]); });
      saveFile('발송용_개인링크',[{name:'개인 링크',rows:rows}]);
    }).catch(failMsg);
  },
  'm-open':function(v){ var me=person(S.m.personId); S.m.productId=v; S.m.img=0; S.m.size=(me&&me.choice&&me.choice.productId===v)?me.choice.size:null; mGo('detail'); },
  'm-img':function(v){ var p=product(S.m.productId); var n=[p.thumbId].concat(p.detailIds||[]).filter(Boolean).length; S.m.img=(S.m.img+Number(v)+n)%n; render(); },
  'm-sheet-open':function(){ S.m.sheet=true; S.m.sheetAnim=true; S.m.err=''; render(); S.m.sheetAnim=false; },
  'm-sheet-close':function(){ S.m.sheet=false; S.m.err=''; render(); },
  'm-size':function(v){ S.m.size=Number(v); S.m.err=''; render(); },
  'm-pick':function(){
    var m=S.m, me=person(m.personId); if(!me||closed()) return;
    if(!m.size){ m.err='사이즈를 골라 주세요.'; render(); return; }
    if(cfg().ship==='personal'){ mGo('addr'); return; }
    choose(me,null);
  },
  'm-addr-open':function(){ if(!window.daum || !window.daum.Postcode){ S.m.manual=true; render(); toast('주소 검색을 불러오지 못했어요. 직접 입력해 주세요.'); return; } S.m.addrOpen=true; S.m.err=''; render(); window.scrollTo(0,0); },
  'm-addr-close':function(){ S.m.addrOpen=false; render(); },
  'm-manual':function(){ S.m.manual=!S.m.manual; S.m.err=''; render(); },
  'm-addr-save':function(){
    var m=S.m, me=person(m.personId), a; if(!me) return;
    if(m.manual) a=m.addr.trim();
    else if(m.road) a='('+m.zip+') '+m.road+(m.addr2.trim()?' '+m.addr2.trim():'');
    else a=String(me.address||'').trim();
    if(a.length<5){ m.err = m.manual ? '받으실 주소를 입력해 주세요.' : '주소 검색을 눌러 받으실 주소를 골라 주세요.'; render(); return; }
    if(!m.agree){ m.err='주소 수집·이용에 동의해 주세요.'; render(); return; }
    choose(me,a);
  }
};
document.addEventListener('click',function(e){
  var t=e.target.closest ? e.target.closest('[data-a]') : null; if(!t || t.disabled) return;
  var fn=ACT[t.getAttribute('data-a')]; if(fn) fn(t.getAttribute('data-v'));
});
document.addEventListener('input',function(e){
  var t=e.target, f=t.getAttribute && t.getAttribute('data-f'); if(!f) return;
  setPath(f,t.value);
  if(f==='filter.q'){ var b=document.getElementById('people-body'); if(b) b.innerHTML=peopleRows(); }
  if(f.indexOf('cfg.')===0){ var pv=document.getElementById('pv'); if(pv) pv.innerHTML=previewInner(); var cc=document.getElementById('c-count'); if(cc) cc.textContent=S.cfg.body.length+'자 · 300자 안쪽을 추천해요'; }
});
document.addEventListener('change',function(e){
  var t=e.target; if(!t.getAttribute) return;
  var c=t.getAttribute('data-c'), up=t.getAttribute('data-up'), pid=t.getAttribute('data-pid');
  if(t.getAttribute('data-pjsel')){ setPid(t.value||null); render(); return; }
  if(t.getAttribute('data-pjst')){ var cur=curProject(); if(!cur) return; var nd=strip(cur); nd.status=t.value; saveDoc('projects',cur.id,nd).then(function(){ toast('상태를 바꿨어요.'); }).catch(failMsg); return; }
  if(c){
    var v = t.type==='checkbox' ? t.checked : (c==='pd.from'||c==='pd.to') ? Number(t.value) : t.value;
    setPath(c,v); render();
  } else if(pid){
    var ids=[]; Array.prototype.forEach.call(document.querySelectorAll('[data-pid]'),function(x){ if(x.checked) ids.push(x.getAttribute('data-pid')); });
    S.cfg.productIds = ids.length===S.products.length ? null : ids;
  } else if(up==='people'){
    var file=t.files&&t.files[0]; if(!file) return;
    S.busy='people'; render();
    parseRoster(file).then(function(list){
      if(!list.length){ S.busy=''; render(); toast('명단에서 이름을 찾지 못했어요. 양식을 확인해 주세요.'); return; }
      var base=Date.now();
      return seqEach(list,function(p,i){ base+=1; return saveDoc('people',null,{projectId:S.pid,token:newToken(),name:p.name,team:p.team,phone:p.phone,createdAt:base}); }).then(function(){ S.busy=''; render(); toast(list.length+'명을 추가했어요.'); });
    }).catch(function(e){ S.busy=''; render(); if(e&&e.code) failMsg(e); else toast('파일을 읽지 못했어요. 엑셀이나 CSV 파일인지 확인해 주세요.'); });
  } else if(up==='greet'){
    var gf=t.files&&t.files[0]; if(!gf||!assets||!S.cfg) return;
    if(gf.size>5*1024*1024){ toast('사진이 5MB보다 커요. 더 작은 파일로 올려 주세요.'); return; }
    S.busy='up'; render();
    assets.upload(gf).then(function(r){ S.busy=''; if(S.cfg) S.cfg.imageId=r.id; render(); toast('사진을 올렸어요. 저장을 눌러야 직원 화면에 반영돼요.'); },function(){ S.busy=''; render(); toast('사진을 올리지 못했어요. 파일 형식을 확인해 주세요.'); });
  } else if(up==='thumb'||up==='detail'){
    var files=Array.prototype.slice.call(t.files||[]); if(!files.length||!assets||!S.pd) return;
    S.busy='up'; render();
    seqEach(files,function(f){ if(f.size>5*1024*1024) return Promise.reject({big:1}); return assets.upload(f).then(function(r){ if(!S.pd) return; if(up==='thumb') S.pd.thumbId=r.id; else S.pd.detailIds.push(r.id); }); }).then(function(){ S.busy=''; render(); }).catch(function(){ S.busy=''; render(); toast('이미지를 올리지 못했어요. 파일 크기와 형식을 확인해 주세요.'); });
  }
});
document.addEventListener('compositionstart',function(){ composing=true; });
document.addEventListener('compositionend',function(){ composing=false; });
document.addEventListener('focusout',function(){ setTimeout(function(){ if(pending) schedule(); },80); });
window.addEventListener('hashchange',function(){ var was=S.link; route(); if(sb && S.link){ loadInvite(); } else if(sb && was){ S.pid=null; S.m=mReset(); bootAdmin(); } else render(); window.scrollTo(0,0); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape' && S.modal){ S.modal=null; render(); } else if(e.key==='Escape' && S.m.sheet){ S.m.sheet=false; render(); } if(e.key==='Enter' && e.target && (e.target.id==='lg-pw'||e.target.id==='lg-email') && !e.isComposing) ACT.login(); });
init();
